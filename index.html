<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semuni Games - Aviator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #111218;
            border-bottom: 1px solid #1f222e;
        }
        .header-logo {
            font-size: 1.25rem;
            font-weight: 900;
            font-style: italic;
            color: #e11d48;
            letter-spacing: 1px;
        }
        .mode-pill {
            background: #f59e0b;
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .balance-box {
            font-size: 0.9rem;
            font-weight: 800;
            color: #22c55e;
        }
        .history-row {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            background: #0e0f14;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #1a1c24;
        }
        .history-row::-webkit-scrollbar { display: none; }
        .badge {
            background: #171922;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .badge.blue { color: #38bdf8; }
        .badge.purple { color: #c084fc; }

        .arena {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        canvas#game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .center-overlay {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        .multiplier-num {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
        }
        .flew-away {
            display: none;
            color: #ef4444;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .panels-box {
            background: #0e0f15;
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1b1d28;
        }
        .panel {
            flex: 1;
            background: #141620;
            border: 1px solid #202332;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .panel-nav {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
        }
        .panel-nav span.active {
            color: #fff;
            border-bottom: 2px solid #e11d48;
        }
        .panel-content {
            display: flex;
            gap: 6px;
        }
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stepper {
            display: flex;
            align-items: center;
            background: #090a0f;
            border: 1px solid #282a3a;
            border-radius: 6px;
            padding: 2px 4px;
        }
        .step-ctrl {
            background: #1c1e2b;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
        }
        .amount-inp {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 800;
            text-align: center;
            outline: none;
            font-size: 0.9rem;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }
        .preset-item {
            background: #191c28;
            border: 1px solid #26293a;
            color: #94a3b8;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 0;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }
        .btn-action {
            width: 88px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.25);
        }
        .btn-action small {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.85;
        }
        .btn-action.cashout {
            background: #f59e0b;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.25);
        }
        .btn-action.disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="header-logo">Aviator</span>
        <span class="mode-pill">FUN MODE</span>
        <span class="balance-box" id="wallet-balance">3,000.00 ETB</span>
    </div>

    <div class="history-row" id="history-row">
        <span class="badge blue">1.16x</span>
        <span class="badge purple">19.19x</span>
        <span class="badge blue">1.01x</span>
        <span class="badge purple">12.28x</span>
        <span class="badge purple">4.13x</span>
        <span class="badge purple">5.45x</span>
        <span class="badge blue">1.20x</span>
        <span class="badge purple">2.12x</span>
        <span class="badge blue">1.76x</span>
    </div>

    <div class="arena" id="arena-box">
        <canvas id="game-canvas"></canvas>
        <div class="center-overlay">
            <div class="multiplier-num" id="mult-label">1.00x</div>
            <div class="flew-away" id="flew-label">FLEW AWAY!</div>
        </div>
    </div>

    <div class="panels-box">
        <div class="panel">
            <div class="panel-nav">
                <span class="active">Bet</span>
                <span>Auto</span>
            </div>
            <div class="panel-content">
                <div class="input-group">
                    <div class="stepper">
                        <button class="step-ctrl" onclick="changeVal(1, -5)">-</button>
                        <input type="number" id="inp-1" class="amount-inp" value="10">
                        <button class="step-ctrl" onclick="changeVal(1, 5)">+</button>
                    </div>
                    <div class="preset-grid">
                        <div class="preset-item" onclick="setVal(1, 10)">10</div>
                        <div class="preset-item" onclick="setVal(1, 50)">50</div>
                        <div class="preset-item" onclick="setVal(1, 100)">100</div>
                        <div class="preset-item" onclick="setVal(1, 500)">500</div>
                    </div>
                </div>
                <button id="act-btn-1" class="btn-action" onclick="handleBet(1)">
                    <span>BET</span>
                    <small id="sub-1">10 ETB</small>
                </button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-nav">
                <span class="active">Bet</span>
                <span>Auto</span>
            </div>
            <div class="panel-content">
                <div class="input-group">
                    <div class="stepper">
                        <button class="step-ctrl" onclick="changeVal(2, -5)">-</button>
                        <input type="number" id="inp-2" class="amount-inp" value="20">
                        <button class="step-ctrl" onclick="changeVal(2, 5)">+</button>
                    </div>
                    <div class="preset-grid">
                        <div class="preset-item" onclick="setVal(2, 20)">20</div>
                        <div class="preset-item" onclick="setVal(2, 50)">50</div>
                        <div class="preset-item" onclick="setVal(2, 100)">100</div>
                        <div class="preset-item" onclick="setVal(2, 1000)">1000</div>
                    </div>
                </div>
                <button id="act-btn-2" class="btn-action" onclick="handleBet(2)">
                    <span>BET</span>
                    <small id="sub-2">20 ETB</small>
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const multLabel = document.getElementById("mult-label");
        const flewLabel = document.getElementById("flew-label");
        const historyRow = document.getElementById("history-row");

        let W = 0, H = 0;
        function updateCanvas() {
            W = canvas.parentElement.clientWidth;
            H = canvas.parentElement.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        window.addEventListener("resize", updateCanvas);
        updateCanvas();

        let state = "WAIT"; // WAIT, RUN, CRASH
        let currentMultiplier = 1.00;
        let crashLimit = 2.00;
        let timer = 0;
        let propRot = 0;
        let loopRef = null;

        let b1 = { betPlaced: false, cashed: false, val: 10 };
        let b2 = { betPlaced: false, cashed: false, val: 20 };

        function setVal(p, v) {
            document.getElementById(`inp-${p}`).value = v;
            document.getElementById(`sub-${p}`).innerText = `${v} ETB`;
        }
        function changeVal(p, d) {
            let el = document.getElementById(`inp-${p}`);
            let val = Math.max(5, (parseInt(el.value) || 0) + d);
            el.value = val;
            document.getElementById(`sub-${p}`).innerText = `${val} ETB`;
        }

        function handleBet(p) {
            let obj = p === 1 ? b1 : b2;
            let btn = document.getElementById(`act-btn-${p}`);
            let inp = document.getElementById(`inp-${p}`);

            if (state === "RUN" && obj.betPlaced && !obj.cashed) {
                obj.cashed = true;
                let win = (obj.val * currentMultiplier).toFixed(2);
                btn.className = "btn-action disabled";
                btn.innerHTML = `<span>WIN</span><small>${win} ETB</small>`;
            } else if (!obj.betPlaced) {
                obj.betPlaced = true;
                obj.cashed = false;
                obj.val = parseFloat(inp.value) || 10;
                btn.className = "btn-action disabled";
                btn.innerHTML = `<span>WAITING</span><small>${obj.val} ETB</small>`;
            }
        }

        function renderBackground() {
            ctx.fillStyle = "#090a0f";
            ctx.fillRect(0, 0, W, H);

            let originX = 0;
            let originY = H;
            let count = 20;
            for (let i = 0; i < count; i++) {
                if (i % 2 === 0) {
                    ctx.fillStyle = "#11131c";
                    ctx.beginPath();
                    ctx.moveTo(originX, originY);
                    let th1 = (i / count) * (Math.PI / 2);
                    let th2 = ((i + 1) / count) * (Math.PI / 2);
                    ctx.arc(originX, originY, Math.max(W, H) * 1.6, -th1, -th2, true);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            for (let x = 25; x < W; x += 35) {
                ctx.beginPath();
                ctx.arc(x, H - 8, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
            for (let y = H - 25; y > 15; y -= 35) {
                ctx.beginPath();
                ctx.arc(8, y, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function renderJet(x, y, rad) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rad);

            // Red body
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            ctx.moveTo(-30, 3);
            ctx.lineTo(-20, -5);
            ctx.lineTo(16, -6);
            ctx.lineTo(26, 1);
            ctx.lineTo(24, 6);
            ctx.lineTo(-26, 6);
            ctx.closePath();
            ctx.fill();

            // Wing
            ctx.fillStyle = "#be123c";
            ctx.beginPath();
            ctx.moveTo(-6, 4);
            ctx.lineTo(8, -13);
            ctx.lineTo(16, -13);
            ctx.lineTo(4, 4);
            ctx.closePath();
            ctx.fill();

            // Tail
            ctx.fillStyle = "#9f1239";
            ctx.beginPath();
            ctx.moveTo(-24, 3);
            ctx.lineTo(-34, -11);
            ctx.lineTo(-27, -11);
            ctx.lineTo(-18, 3);
            ctx.closePath();
            ctx.fill();

            // Propeller spin
            propRot += 0.5;
            ctx.save();
            ctx.translate(27, 3);
            ctx.rotate(propRot);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-1.5, -13, 3, 26);
            ctx.restore();

            ctx.restore();
        }

        function beginRound() {
            state = "RUN";
            currentMultiplier = 1.00;

            let rnd = Math.random();
            if (rnd < 0.12) crashLimit = 1.04;
            else if (rnd < 0.65) crashLimit = (1.1 + Math.random() * 1.8).toFixed(2);
            else if (rnd < 0.9) crashLimit = (2.2 + Math.random() * 3.8).toFixed(2);
            else crashLimit = (6.0 + Math.random() * 12.0).toFixed(2);

            flewLabel.style.display = "none";
            multLabel.style.color = "#ffffff";

            [1, 2].forEach(p => {
                let obj = p === 1 ? b1 : b2;
                let btn = document.getElementById(`act-btn-${p}`);
                if (obj.betPlaced) {
                    btn.className = "btn-action cashout";
                    btn.innerHTML = `<span>CASHOUT</span><small>${(obj.val * currentMultiplier).toFixed(1)} ETB</small>`;
                }
            });

            timer = performance.now();
            runLoop();
        }

        function runLoop() {
            let diff = (performance.now() - timer) / 1000;
            currentMultiplier = +(1.00 + 0.065 * Math.pow(diff, 1.8)).toFixed(2);
            multLabel.innerText = currentMultiplier.toFixed(2) + "x";

            [1, 2].forEach(p => {
                let obj = p === 1 ? b1 : b2;
                let btn = document.getElementById(`act-btn-${p}`);
                if (obj.betPlaced && !obj.cashed) {
                    btn.innerHTML = `<span>CASHOUT</span><small>${(obj.val * currentMultiplier).toFixed(1)} ETB</small>`;
                }
            });

            renderBackground();

            let norm = Math.min((currentMultiplier - 1) / (Math.max(crashLimit, 4) - 1), 1);
            let sx = 20;
            let sy = H - 20;
            let px = sx + (W * 0.7) * Math.min(norm * 1.15, 1);
            let py = sy - (H * 0.65) * Math.pow(Math.min(norm * 1.15, 1), 0.85);

            // Shaded Curve
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo((sx + px) * 0.45, sy, px, py);
            ctx.lineTo(px, sy);
            ctx.closePath();

            let grad = ctx.createLinearGradient(0, py, 0, sy);
            grad.addColorStop(0, "rgba(225, 29, 72, 0.45)");
            grad.addColorStop(1, "rgba(225, 29, 72, 0.02)");
            ctx.fillStyle = grad;
            ctx.fill();

            // Flight Curve
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo((sx + px) * 0.45, sy, px, py);
            ctx.strokeStyle = "#e11d48";
            ctx.lineWidth = 3.5;
            ctx.stroke();

            // Jet Draw
            renderJet(px, py, -0.22);

            if (currentMultiplier >= crashLimit) {
                finishRound(px, py);
            } else {
                loopRef = requestAnimationFrame(runLoop);
            }
        }

        function finishRound(lx, ly) {
            cancelAnimationFrame(loopRef);
            state = "CRASH";
            flewLabel.style.display = "block";
            multLabel.style.color = "#ef4444";

            let pill = document.createElement("span");
            pill.className = `badge ${crashLimit > 2 ? 'purple' : 'blue'}`;
            pill.innerText = `${crashLimit}x`;
            historyRow.prepend(pill);

            [1, 2].forEach(p => {
                let obj = p === 1 ? b1 : b2;
                let btn = document.getElementById(`act-btn-${p}`);
                let inp = document.getElementById(`inp-${p}`);
                obj.betPlaced = false;
                obj.cashed = false;
                btn.className = "btn-action";
                btn.innerHTML = `<span>BET</span><small>${inp.value} ETB</small>`;
            });

            let offX = lx;
            let offY = ly;
            function flyOff() {
                offX += 18;
                offY -= 8;
                renderBackground();
                renderJet(offX, offY, -0.35);
                if (offX < W + 80) {
                    requestAnimationFrame(flyOff);
                } else {
                    setTimeout(beginRound, 2500);
                }
            }
            flyOff();
        }

        setTimeout(beginRound, 1000);
    </script>
</body>
</html>
