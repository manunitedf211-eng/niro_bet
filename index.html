<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semuni Games - Aviator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0c0d14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Top Header */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #10111a;
            border-bottom: 1px solid #1a1c29;
        }
        .logo-text {
            color: #e11d48;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-style: italic;
        }
        .badge-fun {
            background: #f59e0b;
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .user-balance {
            color: #22c55e;
            font-weight: 800;
            font-size: 0.9rem;
        }

        /* History Multipliers */
        .history-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #0f1019;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #191b28;
        }
        .history-wrap::-webkit-scrollbar { display: none; }
        .pill {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 700;
            background: #171926;
        }
        .pill-blue { color: #38bdf8; }
        .pill-purple { color: #c084fc; }

        /* Game Arena */
        .stage {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000000;
            overflow: hidden;
        }
        canvas#aviator-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay-center {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        .mult-val {
            font-size: 3.8rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
        }
        .crash-banner {
            display: none;
            color: #ef4444;
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* Controls Section (Dual Betting Panels) */
        .controls-grid {
            background: #0f1019;
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1c1e2e;
        }
        .bet-card {
            flex: 1;
            background: #141624;
            border: 1px solid #23263b;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #ffffff;
            border-bottom: 2px solid #e11d48;
        }
        .card-body {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }
        .inputs-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .val-stepper {
            display: flex;
            align-items: center;
            background: #090a10;
            border: 1px solid #2a2e45;
            border-radius: 6px;
            padding: 2px 4px;
        }
        .step-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            text-align: center;
            outline: none;
        }
        .step-btn {
            background: #1c1f30;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chips-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px;
        }
        .chip {
            background: #1a1d2e;
            border: 1px solid #2b2f48;
            color: #94a3b8;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 0;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }
        .btn-bet {
            width: 90px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.25);
        }
        .btn-bet small {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.9;
        }
        .btn-bet.cashout {
            background: #f59e0b;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.25);
        }
        .btn-bet.waiting {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <span class="logo-text">Aviator</span>
        <span class="badge-fun">FUN MODE</span>
        <span class="user-balance" id="wallet-balance">5,000.00 ETB</span>
    </div>

    <!-- History -->
    <div class="history-wrap" id="history-box">
        <span class="pill pill-blue">1.16x</span>
        <span class="pill pill-purple">19.19x</span>
        <span class="pill pill-blue">1.01x</span>
        <span class="pill pill-purple">12.28x</span>
        <span class="pill pill-purple">4.13x</span>
        <span class="pill pill-purple">5.45x</span>
        <span class="pill pill-blue">1.20x</span>
        <span class="pill pill-purple">2.12x</span>
        <span class="pill pill-blue">1.76x</span>
    </div>

    <!-- Canvas Animation Area -->
    <div class="stage" id="stage-area">
        <canvas id="aviator-canvas"></canvas>
        <div class="overlay-center">
            <div class="mult-val" id="mult-text">1.00x</div>
            <div class="crash-banner" id="crash-text">FLEW AWAY!</div>
        </div>
    </div>

    <!-- Dual Bet Panels -->
    <div class="controls-grid">
        <!-- Panel 1 -->
        <div class="bet-card">
            <div class="card-top">
                <button class="tab-btn active">Bet</button>
                <button class="tab-btn">Auto</button>
            </div>
            <div class="card-body">
                <div class="inputs-col">
                    <div class="val-stepper">
                        <button class="step-btn" onclick="modifyBet(1, -5)">-</button>
                        <input type="number" id="bet-input-1" class="step-input" value="10">
                        <button class="step-btn" onclick="modifyBet(1, 5)">+</button>
                    </div>
                    <div class="chips-row">
                        <div class="chip" onclick="setBetVal(1, 10)">10</div>
                        <div class="chip" onclick="setBetVal(1, 50)">50</div>
                        <div class="chip" onclick="setBetVal(1, 100)">100</div>
                        <div class="chip" onclick="setBetVal(1, 500)">500</div>
                    </div>
                </div>
                <button id="bet-btn-1" class="btn-bet" onclick="triggerBet(1)">
                    <span>BET</span>
                    <small id="sub-1">10 ETB</small>
                </button>
            </div>
        </div>

        <!-- Panel 2 -->
        <div class="bet-card">
            <div class="card-top">
                <button class="tab-btn active">Bet</button>
                <button class="tab-btn">Auto</button>
            </div>
            <div class="card-body">
                <div class="inputs-col">
                    <div class="val-stepper">
                        <button class="step-btn" onclick="modifyBet(2, -5)">-</button>
                        <input type="number" id="bet-input-2" class="step-input" value="20">
                        <button class="step-btn" onclick="modifyBet(2, 5)">+</button>
                    </div>
                    <div class="chips-row">
                        <div class="chip" onclick="setBetVal(2, 20)">20</div>
                        <div class="chip" onclick="setBetVal(2, 50)">50</div>
                        <div class="chip" onclick="setBetVal(2, 100)">100</div>
                        <div class="chip" onclick="setBetVal(2, 1000)">1000</div>
                    </div>
                </div>
                <button id="bet-btn-2" class="btn-bet" onclick="triggerBet(2)">
                    <span>BET</span>
                    <small id="sub-2">20 ETB</small>
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById("aviator-canvas");
        const ctx = canvas.getContext("2d");
        const multText = document.getElementById("mult-text");
        const crashText = document.getElementById("crash-text");
        const historyBox = document.getElementById("history-box");

        let W = 0, H = 0;
        function fitCanvas() {
            W = canvas.parentElement.clientWidth;
            H = canvas.parentElement.clientHeight;
            canvas.width = W;
            canvas.height = H;
        }
        window.addEventListener("resize", fitCanvas);
        fitCanvas();

        let state = "WAITING"; // WAITING, FLYING, CRASHED
        let multiplier = 1.00;
        let crashPoint = 2.00;
        let animId = null;
        let startTime = 0;
        let propellerAngle = 0;

        let p1 = { active: false, amount: 10, cashed: false };
        let p2 = { active: false, amount: 20, cashed: false };

        function setBetVal(panel, v) {
            document.getElementById(`bet-input-${panel}`).value = v;
            document.getElementById(`sub-${panel}`).innerText = `${v} ETB`;
        }
        function modifyBet(panel, delta) {
            let el = document.getElementById(`bet-input-${panel}`);
            let val = Math.max(5, (parseInt(el.value) || 0) + delta);
            el.value = val;
            document.getElementById(`sub-${panel}`).innerText = `${val} ETB`;
        }

        function triggerBet(panel) {
            let p = panel === 1 ? p1 : p2;
            let btn = document.getElementById(`bet-btn-${panel}`);
            let input = document.getElementById(`bet-input-${panel}`);

            if (state === "FLYING" && p.active && !p.cashed) {
                p.cashed = true;
                let won = (p.amount * multiplier).toFixed(2);
                btn.className = "btn-bet waiting";
                btn.innerHTML = `<span>WIN</span><small>${won} ETB</small>`;
            } else if (!p.active) {
                p.active = true;
                p.cashed = false;
                p.amount = parseFloat(input.value) || 10;
                btn.className = "btn-bet waiting";
                btn.innerHTML = `<span>WAITING</span><small>${p.amount} ETB</small>`;
            }
        }

        function drawBackgroundRays() {
            ctx.fillStyle = "#0c0d14";
            ctx.fillRect(0, 0, W, H);

            let cx = 0;
            let cy = H;
            let numRays = 18;
            for (let i = 0; i < numRays; i++) {
                if (i % 2 === 0) {
                    ctx.fillStyle = "#121420";
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    let a1 = (i / numRays) * (Math.PI / 2);
                    let a2 = ((i + 1) / numRays) * (Math.PI / 2);
                    ctx.arc(cx, cy, Math.max(W, H) * 1.5, -a1, -a2, true);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Axis dots
            ctx.fillStyle = "rgba(255,255,255,0.25)";
            for (let x = 30; x < W; x += 40) {
                ctx.beginPath();
                ctx.arc(x, H - 10, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            for (let y = H - 30; y > 20; y -= 40) {
                ctx.beginPath();
                ctx.arc(12, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawAviatorPlane(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Plane Body
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            ctx.moveTo(-32, 4);
            ctx.lineTo(-24, -4);
            ctx.lineTo(16, -5);
            ctx.lineTo(26, 2);
            ctx.lineTo(24, 7);
            ctx.lineTo(-28, 7);
            ctx.closePath();
            ctx.fill();

            // Wing
            ctx.fillStyle = "#be123c";
            ctx.beginPath();
            ctx.moveTo(-8, 5);
            ctx.lineTo(8, -12);
            ctx.lineTo(16, -12);
            ctx.lineTo(4, 5);
            ctx.closePath();
            ctx.fill();

            // Tail
            ctx.fillStyle = "#9f1239";
            ctx.beginPath();
            ctx.moveTo(-28, 4);
            ctx.lineTo(-38, -10);
            ctx.lineTo(-30, -10);
            ctx.lineTo(-22, 4);
            ctx.closePath();
            ctx.fill();

            // Propeller
            propellerAngle += 0.45;
            ctx.save();
            ctx.translate(27, 4);
            ctx.rotate(propellerAngle);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-1.5, -14, 3, 28);
            ctx.restore();

            ctx.restore();
        }

        function startRound() {
            state = "FLYING";
            multiplier = 1.00;
            // Aviator probability distribution
            let r = Math.random();
            if (r < 0.1) crashPoint = 1.05;
            else if (r < 0.6) crashPoint = (1.1 + Math.random() * 1.8).toFixed(2);
            else if (r < 0.88) crashPoint = (2.2 + Math.random() * 3.5).toFixed(2);
            else crashPoint = (5.5 + Math.random() * 15.0).toFixed(2);

            crashText.style.display = "none";
            multText.style.color = "#ffffff";

            [1, 2].forEach(num => {
                let p = num === 1 ? p1 : p2;
                let btn = document.getElementById(`bet-btn-${num}`);
                if (p.active) {
                    btn.className = "btn-bet cashout";
                    btn.innerHTML = `<span>CASHOUT</span><small>${(p.amount * multiplier).toFixed(1)} ETB</small>`;
                }
            });

            startTime = performance.now();
            loop();
        }

        function loop() {
            let elapsed = (performance.now() - startTime) / 1000;
            multiplier = +(1.00 + 0.06 * Math.pow(elapsed, 1.85)).toFixed(2);
            multText.innerText = multiplier.toFixed(2) + "x";

            [1, 2].forEach(num => {
                let p = num === 1 ? p1 : p2;
                let btn = document.getElementById(`bet-btn-${num}`);
                if (p.active && !p.cashed) {
                    btn.innerHTML = `<span>CASHOUT</span><small>${(p.amount * multiplier).toFixed(1)} ETB</small>`;
                }
            });

            drawBackgroundRays();

            let t = Math.min((multiplier - 1) / (Math.max(crashPoint, 4) - 1), 1);
            let startX = 20;
            let startY = H - 25;
            let targetX = startX + (W * 0.72) * Math.min(t * 1.1, 1);
            let targetY = startY - (H * 0.62) * Math.pow(Math.min(t * 1.1, 1), 0.85);

            // Shaded Red Under-Curve Area
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo((startX + targetX) * 0.45, startY, targetX, targetY);
            ctx.lineTo(targetX, startY);
            ctx.closePath();

            let gradient = ctx.createLinearGradient(0, targetY, 0, startY);
            gradient.addColorStop(0, "rgba(225, 29, 72, 0.45)");
            gradient.addColorStop(1, "rgba(225, 29, 72, 0.02)");
            ctx.fillStyle = gradient;
            ctx.fill();

            // Flight Line
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo((startX + targetX) * 0.45, startY, targetX, targetY);
            ctx.strokeStyle = "#e11d48";
            ctx.lineWidth = 3.5;
            ctx.stroke();

            // Vertical Cutoff Bar
            ctx.beginPath();
            ctx.moveTo(targetX, targetY);
            ctx.lineTo(targetX, startY);
            ctx.strokeStyle = "rgba(225, 29, 72, 0.5)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Draw Airplane
            let angle = -0.22;
            drawAviatorPlane(targetX, targetY, angle);

            if (multiplier >= crashPoint) {
                endRound(targetX, targetY);
            } else {
                animId = requestAnimationFrame(loop);
            }
        }

        function endRound(lastX, lastY) {
            cancelAnimationFrame(animId);
            state = "CRASHED";
            crashText.style.display = "block";
            multText.style.color = "#ef4444";

            // Push History Pill
            let pill = document.createElement("span");
            pill.className = `pill ${crashPoint > 2 ? 'pill-purple' : 'pill-blue'}`;
            pill.innerText = `${crashPoint}x`;
            historyBox.prepend(pill);

            [1, 2].forEach(num => {
                let p = num === 1 ? p1 : p2;
                let btn = document.getElementById(`bet-btn-${num}`);
                let input = document.getElementById(`bet-input-${num}`);
                p.active = false;
                p.cashed = false;
                btn.className = "btn-bet";
                btn.innerHTML = `<span>BET</span><small>${input.value} ETB</small>`;
            });

            // Fly Away Animation
            let flyOffX = lastX;
            let flyOffY = lastY;
            function flyAway() {
                flyOffX += 16;
                flyOffY -= 8;
                drawBackgroundRays();
                drawAviatorPlane(flyOffX, flyOffY, -0.35);
                if (flyOffX < W + 80) {
                    requestAnimationFrame(flyAway);
                } else {
                    setTimeout(startRound, 2500);
                }
            }
            flyAway();
        }

        setTimeout(startRound, 1000);
    </script>
</body>
</html>
